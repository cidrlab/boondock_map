name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'boondock/src/renderer/**'
      - 'boondock/src/shared/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  # Callable so another workflow can deploy inside its own run. A push made
  # with the default GITHUB_TOKEN deliberately does not start further
  # workflows, so the nightly community merge's commit could never trigger the
  # push event above — see community-merge.yml.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
