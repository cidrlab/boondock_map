# Publishes community reports nightly: pulls the Worker's /export, rebuilds
# community.geojson (data-pipeline/merge_community.py), commits it, and then
# deploys.
#
# It has to call the deploy itself. GitHub deliberately does not start new
# workflow runs from pushes made with the default GITHUB_TOKEN, so the commit
# below never fires deploy-pages' push trigger, however well its web/** path
# filter matches. This went unnoticed because every run until 2026-08-09
# reported "no community changes" and never committed anything; the first real
# spot merged fine, landed on main, and simply never reached the live site.
#
# Inert until the repo secrets COMMUNITY_API and COMMUNITY_ADMIN_TOKEN exist
# (worker/README.md, step 2). Note GitHub suspends cron schedules after ~60
# days without repo activity; a manual "Run workflow" revives it.
name: Merge community reports

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC ≈ 2:17 AM Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild community.geojson from the Worker export
        env:
          COMMUNITY_API: ${{ secrets.COMMUNITY_API }}
          COMMUNITY_ADMIN_TOKEN: ${{ secrets.COMMUNITY_ADMIN_TOKEN }}
        run: python3 data-pipeline/merge_community.py web/public/data/community.geojson
      - name: Commit if changed
        run: |
          if git diff --quiet web/public/data/community.geojson; then
            echo "No community changes tonight"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/community.geojson
          git commit -m "Community reports: nightly merge"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: merge

  # Same run, so no second event is needed and no extra token has to exist
  deploy:
    needs: merge
    if: needs.merge.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
